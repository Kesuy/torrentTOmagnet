name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -v

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6.15,<7"

      - name: Build executable
        run: pyinstaller --clean --noconfirm tt.spec

      - name: Smoke test executable
        shell: pwsh
        run: '"3" | & ".\dist\torrentTOmagnet.exe"'

      - name: Rename release asset
        shell: pwsh
        run: Move-Item dist/torrentTOmagnet.exe dist/torrentTOmagnet-windows-x64.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: torrentTOmagnet-windows-x64
          path: dist/torrentTOmagnet-windows-x64.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "dist/torrentTOmagnet-windows-x64.exe"
          --repo "${{ github.repository }}"
          --title "torrentTOmagnet ${{ github.ref_name }}"
          --notes-file RELEASE_NOTES.md
          --verify-tag
