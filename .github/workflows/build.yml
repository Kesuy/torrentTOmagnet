name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -v

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6.15,<7"

      - name: Build executable
        run: pyinstaller --clean --noconfirm tt.spec

      - name: Smoke test executable
        shell: pwsh
        run: '"3" | & ".\dist\torrentTOmagnet.exe"'

      - name: Rename release asset
        shell: pwsh
        run: Move-Item dist/torrentTOmagnet.exe dist/torrentTOmagnet-windows-x64.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: torrentTOmagnet-windows-x64
          path: dist/torrentTOmagnet-windows-x64.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "${{ github.ref_name }}"
          "dist/torrentTOmagnet-windows-x64.exe"
          --repo "${{ github.repository }}"
          --title "torrentTOmagnet ${{ github.ref_name }}"
          --notes-file RELEASE_NOTES.md
          --verify-tag
