name: Windows build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Run tests
        run: python -m unittest discover -v

      - name: Install PyInstaller
        run: python -m pip install "pyinstaller>=6.15,<7"

      - name: Build executable
        run: pyinstaller --clean --noconfirm tt.spec

      - name: Smoke test executable
        shell: pwsh
        run: |
          $fixture = [Text.Encoding]::UTF8.GetBytes("d4:infod4:name12:smoke & testee")
          [IO.File]::WriteAllBytes(".\dist\smoke.torrent", $fixture)
          $process = Start-Process `
            -FilePath ".\dist\torrentTOmagnet.exe" `
            -ArgumentList @("--smoke-test", ".\dist\smoke.torrent", ".\dist\smoke-output.txt") `
            -Wait -PassThru
          if ($process.ExitCode -ne 0) {
            Write-Error "EXE smoke test exited with $($process.ExitCode)"
          }
          $output = Get-Content ".\dist\smoke-output.txt" -Raw
          if ($output -notmatch "magnet:\?xt=urn:btih:" -or $output -notmatch "%26") {
            Write-Error "EXE conversion smoke test failed:`n$output"
          }
          Remove-Item ".\dist\smoke.torrent", ".\dist\smoke-output.txt"

      - name: Rename release asset
        shell: pwsh
        run: Move-Item dist/torrentTOmagnet.exe dist/torrentTOmagnet-windows-x64.exe

      - name: Upload workflow artifact
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: torrentTOmagnet-windows-x64
          path: dist/torrentTOmagnet-windows-x64.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main' && startsWith(github.event.head_commit.message, 'Release v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $message = @'
          ${{ github.event.head_commit.message }}
          '@
          $tag = (($message -split "`r?`n")[0] -replace '^Release\s+', '').Trim()
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag parsed from commit message: $tag"
          }
          gh release create "$tag" `
            "dist/torrentTOmagnet-windows-x64.exe" `
            --repo "${{ github.repository }}" `
            --title "torrentTOmagnet $tag" `
            --notes-file RELEASE_NOTES.md `
            --target "${{ github.sha }}"
